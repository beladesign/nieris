<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="#171019" name="theme-color"/>
  <title>Músicas | Nieris</title>
  <meta content="Músicas originais de Nieris." name="description"/>
  <link href="/styles.css" rel="stylesheet"/>
</head>
<body>
  <div aria-hidden="true" class="ambient-scene">
    <span class="orb a"></span>
    <span class="orb b"></span>
    <span class="orb c"></span>
  </div>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/">nieris<span class="brand-dot">.</span></a>

      <nav aria-label="Navegação principal" class="main-nav">
        <a data-i18n="nav.home" href="/">Home</a>
        <a data-i18n="nav.lore" href="/lore">Lore</a>
        <a aria-current="page" data-i18n="nav.music" href="/music">Músicas</a>
        <a data-i18n="nav.credits" href="/credits">Créditos</a>
        <a data-i18n="nav.fanarts" href="/fanarts">Fanarts</a>
        <a data-i18n="nav.nabis" href="/nabis">Nabis</a>
        <a data-i18n="nav.livepix" href="https://livepix.gg/niee" target="_blank" rel="noopener noreferrer">LivePix</a>
        <a data-i18n="nav.portal" href="/socials">Socials</a>
      </nav>

      <div class="header-controls">
        <div aria-label="Idioma do site" class="language-switch site-language-switch">
          <button data-language-button="pt-BR" type="button">PT-BR</button>
          <button data-language-button="en-US" type="button">EN-US</button>
        </div>
        <button aria-expanded="false" aria-label="Abrir menu" class="menu-button" type="button">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 8h14M5 16h14"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page music-page music-page-v2">
    <section class="shell music-player-shell">
      <div class="music-player-top">
        <div class="music-cover-wrap">
          <div class="music-cover music-cover--butterflies" data-now-cover aria-label="Capa provisória da música">
            <div class="music-cover-glow"></div>
            <div class="music-cover-symbol" aria-hidden="true">
              <span></span><span></span>
            </div>
            <span class="music-cover-placeholder" data-i18n="music.cover_placeholder">capa em breve</span>
          </div>
        </div>

        <div class="music-now">
          <div class="music-now-meta">
            <span class="music-now-number" data-now-number>01</span>
            <span class="music-category" data-now-category>Lore</span>
          </div>

          <p class="music-now-label" data-i18n="music.now_playing">tocando agora</p>
          <h1 data-now-title>Where the Butterflies Turn Black</h1>
          <p class="music-now-note" data-now-note data-i18n="music.main_theme">tema principal da lore</p>

          <div class="music-controls">
            <div class="music-main-controls">
              <button class="music-icon-button" type="button" data-player-prev aria-label="Música anterior">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 6v12M18 7l-8 5 8 5V7Z"></path></svg>
              </button>

              <button class="music-play-button" type="button" data-player-toggle aria-label="Tocar música">
                <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m9 7 8 5-8 5V7Z"></path></svg>
                <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 7h3v10H8zm5 0h3v10h-3z"></path></svg>
              </button>

              <button class="music-icon-button" type="button" data-player-next aria-label="Próxima música">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 6v12M6 7l8 5-8 5V7Z"></path></svg>
              </button>
            </div>

            <div class="music-progress-row">
              <span class="music-time" data-player-current>00:00</span>
              <input class="music-progress" data-player-progress type="range" min="0" max="1000" value="0" aria-label="Progresso da música"/>
              <span class="music-time" data-player-duration>05:33</span>
            </div>

            <div class="music-volume-row">
              <svg class="music-volume-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 10v4h3l4 3V7l-4 3H5Z"></path>
                <path d="M15 9c1 .8 1.5 1.8 1.5 3S16 14.2 15 15"></path>
              </svg>
              <input class="music-volume" data-player-volume type="range" min="0" max="100" value="82" aria-label="Volume"/>
              <span class="music-volume-value" data-player-volume-value>82%</span>
            </div>
          </div>

          <audio data-main-audio preload="metadata" src="/assets/music/where-the-butterflies-turn-black.mp3"></audio>
        </div>
      </div>

      <section class="music-queue" aria-labelledby="music-queue-title">
        <div class="music-queue-heading">
          <div>
            <span class="music-queue-kicker" data-i18n="music.collection_label">coleção</span>
            <h2 id="music-queue-title" data-i18n="music.up_next">Próximas músicas</h2>
          </div>
          <span class="music-queue-count">03</span>
        </div>

        <div class="music-queue-list">
          <button class="music-queue-item is-active"
            type="button"
            data-playlist-item
            data-index="0"
            data-title="Where the Butterflies Turn Black"
            data-src="/assets/music/where-the-butterflies-turn-black.mp3"
            data-duration="05:33"
            data-category-pt="Lore"
            data-category-en="Lore"
            data-note-key="music.main_theme"
            data-cover-class="music-cover--butterflies">
            <span class="queue-cover music-cover--butterflies" aria-hidden="true"></span>
            <span class="queue-copy">
              <span class="queue-category">Lore</span>
              <strong>Where the Butterflies Turn Black</strong>
              <small data-i18n="music.main_theme">tema principal da lore</small>
            </span>
            <span class="queue-duration">05:33</span>
            <span class="queue-action" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="m9 7 8 5-8 5V7Z"></path></svg>
            </span>
          </button>

          <button class="music-queue-item"
            type="button"
            data-playlist-item
            data-index="1"
            data-title="The Girl Between Dreams"
            data-src="/assets/music/the-girl-between-dreams.mp3"
            data-duration="04:47"
            data-category-pt="Pesadelo"
            data-category-en="Nightmare"
            data-note-key="music.category_nightmare_note"
            data-cover-class="music-cover--girl">
            <span class="queue-cover music-cover--girl" aria-hidden="true"></span>
            <span class="queue-copy">
              <span class="queue-category" data-i18n="music.category.nightmare">Pesadelo</span>
              <strong>The Girl Between Dreams</strong>
              <small data-i18n="music.category_nightmare_note">entre mundos que não param de mudar</small>
            </span>
            <span class="queue-duration">04:47</span>
            <span class="queue-action" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="m9 7 8 5-8 5V7Z"></path></svg>
            </span>
          </button>

          <button class="music-queue-item"
            type="button"
            data-playlist-item
            data-index="2"
            data-title="Never Out of Sight"
            data-src="/assets/music/never-out-of-sight.mp3"
            data-duration="05:22"
            data-category-pt="Sonho"
            data-category-en="Dream"
            data-note-key="music.category_dream_note"
            data-cover-class="music-cover--sight">
            <span class="queue-cover music-cover--sight" aria-hidden="true"></span>
            <span class="queue-copy">
              <span class="queue-category" data-i18n="music.category.dream">Sonho</span>
              <strong>Never Out of Sight</strong>
              <small data-i18n="music.category_dream_note">um sonho bonito demais para ser simples</small>
            </span>
            <span class="queue-duration">05:22</span>
            <span class="queue-action" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="m9 7 8 5-8 5V7Z"></path></svg>
            </span>
          </button>
        </div>
      </section>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <span data-i18n="footer.music_left">Nieris · músicas</span>
      <span class="footer-butterfly"></span>
      <span data-i18n="footer.music_right">ecos originais</span>
    </div>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
